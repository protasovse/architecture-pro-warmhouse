services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      - smarthome-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  temperature-api:
    image: wiremock/wiremock:3.13.1
    container_name: smarthome-temperature-api
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
    entrypoint: [ "/docker-entrypoint.sh", "--global-response-templating", "--verbose" ]
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
    container_name: smarthome-app
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TEMPERATURE_API_URL=${TEMPERATURE_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    ports:
      - "${APP_PORT}:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
