[project]
name = "parameters-gateway"
version = "0.1.0"
description = ""
authors = [
    {name = "Sergey Protasov",email = "protasovse@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.115.7,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "confluent-kafka (>=2.8.0,<3.0.0)",
    "aiokafka (>=0.12.0,<0.13.0)",
    "python-decouple (>=3.8,<4.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "aiohttp (>=3.11.12,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "redis (>=5.2.1,<6.0.0)",
    "colorlog (>=6.9.0,<7.0.0)",
    "pygments (>=2.19.1,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]
ruff = "^0.9.3"


[tool.ruff]

line-length = 88
indent-width = 4
target-version = "py313"

exclude = [
    "*",
    "!*.py",
    "b3_bpmn",
    "b3_db_constructor",
    "b3platform",
    "front",
    "scripts",
    "integrations/platformv_iam",
]


[tool.ruff.lint]
select = [
    "E",  # Ошибки PEP8
    "F",  # Pyflakes (неиспользуемые переменные, функции и импорты)
    "W",  # Предупреждения PEP8
    "C90",  # Ошибки стиля (например, отсутствие docstrings)
    "I",  # Упорядочение импортов
    "T",  # Проверка аннотаций типов
]

ignore = [
    "E501",  # Разрешаем длину строки для black
    "E203",  # Разрешаем пробелы перед ':' для black
    "F403",  # Import *
    "F405",  # May be undefined, or defined from star imports
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
